<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #ea580c; } a:hover { color: #c2410c; }
    .c-tbl { width: 100%; border-collapse: collapse; font-size: 14px; line-height: 20px; }
    .c-tbl th { padding: 12px 18px; font-size: 11px; line-height: 16px; font-weight: 500; letter-spacing: 0.05em; color: #a8a29e; text-align: left; white-space: nowrap; }
    .c-tbl td { padding: 12px 18px; vertical-align: middle; }
    .c-num { font-variant-numeric: tabular-nums; }
  </style>
</helmet>
<div style="width: 1440px; height: 900px; display: flex; background: #faf7f2; color: #1c1917; font-family: 'Noto Sans TC', system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden">

  <aside style="width: 240px; flex-shrink: 0; display: flex; flex-direction: column; background: #1c1917">
    <div style="padding: 22px 18px 18px 18px; display: flex; align-items: center; gap: 10px">
      <div style="width: 34px; height: 34px; border-radius: 10px; background: {{accent}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#1c1917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4.5 13.5H11l-1 8.5 8.5-11.5H12z"></path></svg>
      </div>
      <div>
        <div style="font-family: 'Archivo', system-ui, sans-serif; font-size: 15px; line-height: 20px; font-weight: 700; letter-spacing: 0.01em; color: #fafaf9">SPARKTOY</div>
        <div style="font-size: 11px; line-height: 16px; color: #a8a29e">龍杰國際 · 史派克工廠</div>
      </div>
    </div>

    <nav style="flex: 1; padding: 6px 10px; display: flex; flex-direction: column; gap: 3px">
      <div style="position: relative; display: flex; align-items: center; gap: 11px; border-radius: 10px; padding: 10px 14px; font-size: 14px; line-height: 20px; font-weight: 500; color: #fafaf9; background: #292524">
        <span style="position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 3px; background: {{accent}}"></span>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5z"></path><path d="M3 8l9 5 9-5"></path><path d="M12 13v8"></path></svg>
        產品資料
      </div>
      <div style="display: flex; align-items: center; gap: 11px; border-radius: 10px; padding: 10px 14px; font-size: 14px; line-height: 20px; color: #a8a29e">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V8l6-4 6 4v13"></path><path d="M15 21V11h6v10"></path><path d="M3 21h18"></path></svg>
        供應商列表
      </div>
      <div style="display: flex; align-items: center; gap: 11px; border-radius: 10px; padding: 10px 14px; font-size: 14px; line-height: 20px; color: #a8a29e">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 7 19.4a1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0-1.2-2.9H1a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 2.6 7"></path></svg>
        系統管理
      </div>
    </nav>

    <div style="padding: 14px; margin: 10px; border-radius: 12px; background: #292524; display: flex; align-items: center; gap: 10px">
      <div style="width: 32px; height: 32px; border-radius: 999px; background: {{accent}}; color: #1c1917; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0">王</div>
      <div style="min-width: 0; flex: 1">
        <div style="font-size: 13px; line-height: 18px; font-weight: 500; color: #fafaf9">王大明</div>
        <div style="font-size: 11px; line-height: 16px; color: #a8a29e">採購／行政</div>
      </div>
      <div style="color: #78716c">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="m16 17 5-5-5-5"></path><path d="M21 12H9"></path></svg>
      </div>
    </div>
  </aside>

  <main style="flex: 1; min-width: 0; padding: 26px 30px; display: flex; flex-direction: column; gap: 18px">

    <div style="display: flex; align-items: flex-end; justify-content: space-between">
      <div>
        <h1 style="margin: 0; font-size: 26px; line-height: 34px; font-weight: 700; letter-spacing: -0.015em; color: #1c1917">產品資料</h1>
        <div style="margin-top: 2px; font-size: 13px; line-height: 18px; color: #78716c">建檔中的商品與規格，含供應商發單與售價設定</div>
      </div>
      <div style="display: flex; align-items: center; gap: 8px">
        <div style="display: flex; align-items: center; gap: 6px; border-radius: 10px; border: 1px solid #e7e5e4; background: #ffffff; padding: 9px 15px; font-size: 14px; line-height: 20px; font-weight: 500; color: #44403c">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><path d="m7 10 5 5 5-5"></path><path d="M12 15V3"></path></svg>
          Excel 匯入
        </div>
        <div style="display: flex; align-items: center; gap: 6px; border-radius: 10px; background: {{accent}}; padding: 9px 16px; font-size: 14px; line-height: 20px; font-weight: 500; color: #ffffff; box-shadow: 0 2px 6px rgba(234,88,12,0.28)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
          新增商品
        </div>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 10px">
      <div style="position: relative; width: 340px">
        <span style="position: absolute; left: 13px; top: 11px; color: #a8a29e">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        </span>
        <div style="border-radius: 10px; border: 1px solid #e7e5e4; background: #ffffff; padding: 9px 12px 9px 38px; font-size: 14px; line-height: 20px; color: #a8a29e">搜尋品名／品牌／條碼</div>
      </div>
      <div style="display: flex; align-items: center; gap: 6px; border-radius: 999px; background: #f5f0e9; padding: 7px 15px; font-size: 13px; line-height: 20px; color: #57534e">
        <span style="width: 8px; height: 8px; border-radius: 999px; background: #d6d3d1"></span>
        含封存
      </div>
      <div style="flex: 1"></div>
      <div style="font-size: 13px; line-height: 20px; color: #78716c" class="c-num">共 6 筆</div>
    </div>

    <div style="border-radius: 14px; border: 1px solid #ede9e4; background: #ffffff; overflow: hidden; box-shadow: 0 2px 8px rgba(28,25,23,0.05)">
      <table class="c-tbl">
        <thead>
          <tr style="background: #fdfbf8; border-bottom: 1px solid #ede9e4">
            <th>商品</th>
            <th>產地</th>
            <th>預定上市日</th>
            <th>規格</th>
            <th>狀態</th>
            <th style="width: 96px"></th>
          </tr>
        </thead>
        <tbody>
          <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
            <tr style="background: {{r.rowBg}}; border-top: 1px solid #f5f0e9">
              <td>
                <div style="display: flex; align-items: center; gap: 14px">
                  <div style="width: 56px; height: 56px; border-radius: 12px; background: {{r.tint}}; flex-shrink: 0; box-shadow: inset 0 0 0 1px rgba(28,25,23,0.05)"></div>
                  <div style="min-width: 0">
                    <div style="font-size: 15px; line-height: 22px; font-weight: 500; color: {{r.nameColor}}">{{r.name}}</div>
                    <div style="font-size: 12px; line-height: 18px; color: #a8a29e">{{r.brand}}</div>
                  </div>
                </div>
              </td>
              <td style="color: #57534e">{{r.origin}}</td>
              <td style="color: #57534e" class="c-num">{{r.date}}</td>
              <td style="color: #78716c; font-size: 13px">{{r.spec}}</td>
              <td>
                <span style="display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 11px; font-size: 12px; line-height: 18px; font-weight: 500; background: {{r.badgeBg}}; color: {{r.badgeFg}}">
                  <span style="width: 6px; height: 6px; border-radius: 999px; background: {{r.badgeDot}}"></span>{{r.status}}
                </span>
              </td>
              <td>
                <div style="display: flex; gap: 6px; justify-content: flex-end; color: {{r.iconColor}}">
                  <div style="width: 30px; height: 30px; border-radius: 8px; border: 1px solid {{r.iconBorder}}; display: flex; align-items: center; justify-content: center; background: {{r.iconBg}}">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>
                  </div>
                  <div style="width: 30px; height: 30px; border-radius: 8px; border: 1px solid {{r.iconBorder}}; display: flex; align-items: center; justify-content: center; background: {{r.iconBg}}">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="4" rx="1"></rect><path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8"></path><path d="M10 12h4"></path></svg>
                  </div>
                </div>
              </td>
            </tr>
          </sc-for>
        </tbody>
      </table>
    </div>

    <p style="margin: 0; font-size: 12px; line-height: 16px; color: #a8a29e">最多顯示 200 筆，請用搜尋縮小範圍。</p>
  </main>
</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#ea580c","options":["#ea580c","#e11d48","#ca8a04","#0d9488"],"section":"主題"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const data = [
      ['迴力合金小汽車 六入盒組', 'SparkToy', '中國', '2026-09', '單規格', 1, '#ffe4cc'],
      ['恐龍蛋孵化扭蛋 第二彈', '龍杰嚴選', '中國', '2026-10-15', '4 個規格', 1, '#d9f2e4'],
      ['電動泡泡槍 附補充液', 'BubbleFun', '中國', '2026-09-05', '2 個規格', 1, '#d5eefb'],
      ['軟膠公仔 12cm 站姿', '史派克工廠', '日本', '2026-11', '3 個規格', 1, '#fbdce8'],
      ['城市系列拼裝積木 320pcs', 'BrickLab', '中國', '2026-08-20', '單規格', 0, '#efece7'],
      ['迷你廚房家家酒組', 'SparkToy', '台灣', '2026-12', '2 個規格', 1, '#fdf0c4'],
    ];
    return {
      accent: this.props.accent ?? '#ea580c',
      rows: data.map(([name, brand, origin, date, spec, active, tint], i) => ({
        name, brand, origin, date, spec, tint,
        status: active ? '使用中' : '已封存',
        badgeBg: active ? '#e7f6ee' : '#f5f0e9',
        badgeFg: active ? '#15803d' : '#78716c',
        badgeDot: active ? '#22c55e' : '#d6d3d1',
        nameColor: active ? '#1c1917' : '#a8a29e',
        rowBg: i === 1 ? '#fdfbf8' : '#ffffff',
        iconColor: i === 1 ? '#57534e' : '#d6d3d1',
        iconBorder: i === 1 ? '#ede9e4' : 'transparent',
        iconBg: i === 1 ? '#ffffff' : 'transparent',
      })),
    };
  }
}
</script>
</body>
</html>
