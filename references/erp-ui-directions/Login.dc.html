<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #4f46e5; } a:hover { color: #4338ca; }
  </style>
</helmet>
<div style="width: 1440px; height: 900px; display: flex; align-items: center; justify-content: center; background: #f8fafc; color: #0f172a; font-family: 'Noto Sans TC', system-ui, -apple-system, 'Helvetica Neue', sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden">

  <div style="display: flex; align-items: flex-start; justify-content: center; gap: 72px">

    <!-- ═══ 左：一般狀態 ═══ -->
    <div style="width: 384px; display: flex; flex-direction: column; gap: 10px">
      <div style="font-size: 12px; line-height: 16px; color: #94a3b8">一般狀態</div>

      <div style="display: flex; flex-direction: column; gap: 20px; border-radius: 12px; border: 1px solid #e2e8f0; background: #ffffff; padding: 32px; box-shadow: 0 1px 3px rgba(15,23,42,0.05)">

        <div style="display: flex; align-items: center; gap: 12px">
          <div style="width: 44px; height: 44px; border-radius: 12px; background: {{accent}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4.5 13.5H11l-1 8.5 8.5-11.5H12z"></path></svg>
          </div>
          <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
            <div style="font-size: 20px; line-height: 28px; font-weight: 700; letter-spacing: -0.015em; color: #0f172a">SparkToy ERP</div>
            <div style="font-size: 13px; line-height: 18px; color: #64748b">龍杰國際營運整合系統</div>
          </div>
        </div>

        <div style="height: 1px; background: #e2e8f0"></div>

        <div style="display: flex; flex-direction: column; gap: 16px">

          <div style="display: flex; flex-direction: column; gap: 6px">
            <div style="font-size: 12px; line-height: 16px; font-weight: 500; color: #64748b">帳號</div>
            <div style="display: flex; align-items: center; border-radius: 8px; border: 1px solid {{accent}}; background: #ffffff; padding: 8px 12px; font-size: 14px; line-height: 20px; color: #0f172a; box-shadow: 0 0 0 3px {{accentRing}}">
              <span style="width: 1px; height: 18px; background: {{accent}}"></span>
            </div>
          </div>

          <div style="display: flex; flex-direction: column; gap: 6px">
            <div style="font-size: 12px; line-height: 16px; font-weight: 500; color: #64748b">密碼</div>
            <div style="border-radius: 8px; border: 1px solid #cbd5e1; background: #ffffff; padding: 8px 12px; font-size: 14px; line-height: 20px; color: #0f172a">&nbsp;</div>
          </div>

          <div style="display: flex; align-items: center; justify-content: center; border-radius: 8px; background: {{accent}}; padding: 10px; font-size: 14px; line-height: 20px; font-weight: 500; color: #ffffff; box-shadow: 0 1px 2px rgba(15,23,42,0.10)">登入</div>

        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px; padding-top: 14px">
        <div style="font-size: 12px; line-height: 16px; color: #94a3b8">送出中（disabled）</div>
        <div style="display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 8px; background: {{accent}}; padding: 10px; font-size: 14px; line-height: 20px; font-weight: 500; color: #ffffff; opacity: 0.5">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 9 9"></path></svg>
          登入中…
        </div>
      </div>
    </div>

    <!-- ═══ 右：錯誤狀態 ═══ -->
    <div style="width: 384px; display: flex; flex-direction: column; gap: 10px">
      <div style="font-size: 12px; line-height: 16px; color: #94a3b8">錯誤狀態</div>

      <div style="display: flex; flex-direction: column; gap: 20px; border-radius: 12px; border: 1px solid #e2e8f0; background: #ffffff; padding: 32px; box-shadow: 0 1px 3px rgba(15,23,42,0.05)">

        <div style="display: flex; align-items: center; gap: 12px">
          <div style="width: 44px; height: 44px; border-radius: 12px; background: {{accent}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4.5 13.5H11l-1 8.5 8.5-11.5H12z"></path></svg>
          </div>
          <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
            <div style="font-size: 20px; line-height: 28px; font-weight: 700; letter-spacing: -0.015em; color: #0f172a">SparkToy ERP</div>
            <div style="font-size: 13px; line-height: 18px; color: #64748b">龍杰國際營運整合系統</div>
          </div>
        </div>

        <div style="height: 1px; background: #e2e8f0"></div>

        <div style="display: flex; flex-direction: column; gap: 16px">

          <div style="display: flex; flex-direction: column; gap: 6px">
            <div style="font-size: 12px; line-height: 16px; font-weight: 500; color: #64748b">帳號</div>
            <div style="border-radius: 8px; border: 1px solid #cbd5e1; background: #ffffff; padding: 8px 12px; font-size: 14px; line-height: 20px; color: #0f172a">wangdm</div>
          </div>

          <div style="display: flex; flex-direction: column; gap: 6px">
            <div style="font-size: 12px; line-height: 16px; font-weight: 500; color: #64748b">密碼</div>
            <div style="border-radius: 8px; border: 1px solid #cbd5e1; background: #ffffff; padding: 8px 12px; font-size: 14px; line-height: 20px; letter-spacing: 0.12em; color: #475569">••••••••</div>
          </div>

          <div style="display: flex; align-items: center; gap: 8px; border-radius: 8px; background: #fef2f2; padding: 8px 12px">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5v5.5"></path><path d="M12 16.5h.01"></path></svg>
            <span style="font-size: 13px; line-height: 18px; color: #dc2626">帳號或密碼錯誤</span>
          </div>

          <div style="display: flex; align-items: center; justify-content: center; border-radius: 8px; background: {{accent}}; padding: 10px; font-size: 14px; line-height: 20px; font-weight: 500; color: #ffffff; box-shadow: 0 1px 2px rgba(15,23,42,0.10)">登入</div>

        </div>
      </div>
    </div>

  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#4f46e5","options":["#4f46e5","#0f766e","#b45309","#be123c"],"section":"主題"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#4f46e5';
    const soft = { '#4f46e5': '#eef2ff', '#0f766e': '#f0fdfa', '#b45309': '#fffbeb', '#be123c': '#fff1f2' };
    const text = { '#4f46e5': '#4338ca', '#0f766e': '#0f766e', '#b45309': '#b45309', '#be123c': '#be123c' };
    const hex = String(accent).replace('#', '');
    const r = parseInt(hex.slice(0, 2), 16) || 79;
    const g = parseInt(hex.slice(2, 4), 16) || 70;
    const b = parseInt(hex.slice(4, 6), 16) || 229;
    return {
      accent,
      accentSoft: soft[accent] ?? '#eef2ff',
      accentText: text[accent] ?? '#4338ca',
      accentRing: 'rgba(' + r + ',' + g + ',' + b + ',0.15)',
    };
  }
}
</script>
</body>
</html>
