<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #4f46e5; } a:hover { color: #4338ca; }
    .b-tbl { width: 100%; border-collapse: collapse; font-size: 14px; line-height: 20px; }
    .b-tbl th { padding: 10px 16px; font-size: 11px; line-height: 16px; font-weight: 500; letter-spacing: 0.04em; color: #64748b; text-align: left; white-space: nowrap; }
    .b-tbl td { padding: 10px 16px; vertical-align: middle; border-top: 1px solid #f1f5f9; }
    .b-num { font-variant-numeric: tabular-nums; }
  </style>
</helmet>
<div style="width: 1440px; height: 900px; display: flex; background: #f8fafc; color: #0f172a; font-family: 'Noto Sans TC', system-ui, -apple-system, 'Helvetica Neue', sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden">

  <aside style="width: 240px; flex-shrink: 0; display: flex; flex-direction: column; border-right: 1px solid #e2e8f0; background: #ffffff">
    <div style="padding: 20px 16px 16px 16px; display: flex; align-items: center; gap: 10px">
      <div style="width: 32px; height: 32px; border-radius: 8px; background: {{accent}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4.5 13.5H11l-1 8.5 8.5-11.5H12z"></path></svg>
      </div>
      <div>
        <div style="font-size: 14px; line-height: 20px; font-weight: 700; letter-spacing: -0.01em; color: #0f172a">SparkToy ERP</div>
        <div style="font-size: 12px; line-height: 16px; color: #94a3b8">龍杰國際</div>
      </div>
    </div>

    <div style="padding: 8px 20px 6px 20px; font-size: 11px; line-height: 16px; font-weight: 500; letter-spacing: 0.06em; color: #94a3b8">主要作業</div>
    <nav style="flex: 1; padding: 0 8px; display: flex; flex-direction: column; gap: 2px">
      <div style="position: relative; display: flex; align-items: center; gap: 10px; border-radius: 8px; padding: 8px 12px; font-size: 14px; line-height: 20px; font-weight: 500; color: {{accentText}}; background: {{accentSoft}}">
        <span style="position: absolute; left: 0; top: 8px; bottom: 8px; width: 2px; border-radius: 2px; background: {{accent}}"></span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5z"></path><path d="M3 8l9 5 9-5"></path><path d="M12 13v8"></path></svg>
        產品資料
      </div>
      <div style="display: flex; align-items: center; gap: 10px; border-radius: 8px; padding: 8px 12px; font-size: 14px; line-height: 20px; color: #475569">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V8l6-4 6 4v13"></path><path d="M15 21V11h6v10"></path><path d="M3 21h18"></path></svg>
        供應商列表
      </div>
      <div style="display: flex; align-items: center; gap: 10px; border-radius: 8px; padding: 8px 12px; font-size: 14px; line-height: 20px; color: #475569">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 7 19.4a1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0-1.2-2.9H1a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 2.6 7"></path></svg>
        系統管理
      </div>
    </nav>

    <div style="border-top: 1px solid #e2e8f0; padding: 12px; display: flex; align-items: center; gap: 10px">
      <div style="width: 32px; height: 32px; border-radius: 999px; background: #e2e8f0; color: #475569; font-size: 12px; font-weight: 500; display: flex; align-items: center; justify-content: center; flex-shrink: 0">王</div>
      <div style="min-width: 0; flex: 1">
        <div style="font-size: 13px; line-height: 18px; font-weight: 500; color: #0f172a">王大明</div>
        <div style="font-size: 11px; line-height: 16px; color: #94a3b8">採購／行政</div>
      </div>
      <div style="width: 28px; height: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #94a3b8">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="m16 17 5-5-5-5"></path><path d="M21 12H9"></path></svg>
      </div>
    </div>
  </aside>

  <main style="flex: 1; min-width: 0; padding: 24px 28px; display: flex; flex-direction: column; gap: 18px">

    <div style="display: flex; align-items: flex-end; justify-content: space-between">
      <div>
        <div style="font-size: 12px; line-height: 16px; color: #94a3b8">產品管理</div>
        <h1 style="margin: 2px 0 0 0; font-size: 24px; line-height: 32px; font-weight: 700; letter-spacing: -0.015em; color: #0f172a">產品資料</h1>
      </div>
      <div style="display: flex; align-items: center; gap: 8px">
        <div style="display: flex; align-items: center; gap: 6px; border-radius: 8px; border: 1px solid #cbd5e1; background: #ffffff; padding: 8px 14px; font-size: 14px; line-height: 20px; font-weight: 500; color: #334155; box-shadow: 0 1px 2px rgba(15,23,42,0.04)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><path d="m7 10 5 5 5-5"></path><path d="M12 15V3"></path></svg>
          Excel 匯入
        </div>
        <div style="display: flex; align-items: center; gap: 6px; border-radius: 8px; background: {{accent}}; padding: 8px 14px; font-size: 14px; line-height: 20px; font-weight: 500; color: #ffffff; box-shadow: 0 1px 2px rgba(15,23,42,0.10)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
          新增商品
        </div>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 10px">
      <div style="position: relative; width: 320px">
        <span style="position: absolute; left: 12px; top: 10px; color: #94a3b8">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        </span>
        <div style="border-radius: 8px; border: 1px solid #cbd5e1; background: #ffffff; padding: 8px 12px 8px 36px; font-size: 14px; line-height: 20px; color: #94a3b8; box-shadow: 0 1px 2px rgba(15,23,42,0.03)">搜尋品名／品牌／條碼</div>
      </div>
      <div style="display: flex; align-items: center; gap: 6px; border-radius: 999px; border: 1px solid #e2e8f0; background: #ffffff; padding: 6px 14px; font-size: 13px; line-height: 20px; color: #475569">
        <span style="width: 8px; height: 8px; border-radius: 999px; background: #cbd5e1"></span>
        含封存
      </div>
      <div style="flex: 1"></div>
      <div style="font-size: 13px; line-height: 20px; color: #64748b" class="b-num">共 6 筆</div>
    </div>

    <div style="border-radius: 12px; border: 1px solid #e2e8f0; background: #ffffff; overflow: hidden; box-shadow: 0 1px 3px rgba(15,23,42,0.05)">
      <table class="b-tbl">
        <thead>
          <tr style="background: #f8fafc">
            <th style="width: 64px"></th>
            <th>商品品名</th>
            <th>品牌／廠牌</th>
            <th>產地</th>
            <th>預定上市日</th>
            <th>規格</th>
            <th>狀態</th>
            <th style="width: 88px"></th>
          </tr>
        </thead>
        <tbody>
          <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
            <tr style="background: {{r.rowBg}}">
              <td><div style="width: 40px; height: 40px; border-radius: 8px; background: {{r.tint}}; box-shadow: inset 0 0 0 1px rgba(15,23,42,0.06)"></div></td>
              <td><span style="font-weight: 500; color: {{r.nameColor}}">{{r.name}}</span></td>
              <td style="color: #475569">{{r.brand}}</td>
              <td style="color: #475569">{{r.origin}}</td>
              <td style="color: #475569" class="b-num">{{r.date}}</td>
              <td style="color: #64748b; font-size: 13px">{{r.spec}}</td>
              <td>
                <span style="display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 2px 10px; font-size: 12px; line-height: 18px; font-weight: 500; background: {{r.badgeBg}}; color: {{r.badgeFg}}">
                  <span style="width: 6px; height: 6px; border-radius: 999px; background: {{r.badgeDot}}"></span>{{r.status}}
                </span>
              </td>
              <td>
                <div style="display: flex; gap: 4px; justify-content: flex-end; color: {{r.iconColor}}">
                  <div style="width: 28px; height: 28px; border-radius: 6px; border: 1px solid {{r.iconBorder}}; display: flex; align-items: center; justify-content: center; background: {{r.iconBg}}">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>
                  </div>
                  <div style="width: 28px; height: 28px; border-radius: 6px; border: 1px solid {{r.iconBorder}}; display: flex; align-items: center; justify-content: center; background: {{r.iconBg}}">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="4" rx="1"></rect><path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8"></path><path d="M10 12h4"></path></svg>
                  </div>
                </div>
              </td>
            </tr>
          </sc-for>
        </tbody>
      </table>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between">
      <p style="margin: 0; font-size: 12px; line-height: 16px; color: #94a3b8">最多顯示 200 筆，請用搜尋縮小範圍。</p>
    </div>
  </main>
</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#4f46e5","options":["#4f46e5","#0f766e","#b45309","#be123c"],"section":"主題"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#4f46e5';
    const soft = { '#4f46e5': '#eef2ff', '#0f766e': '#f0fdfa', '#b45309': '#fffbeb', '#be123c': '#fff1f2' };
    const text = { '#4f46e5': '#4338ca', '#0f766e': '#0f766e', '#b45309': '#b45309', '#be123c': '#be123c' };
    const data = [
      ['迴力合金小汽車 六入盒組', 'SparkToy', '中國', '2026-09', '單規格', 1, '#e0e7ff'],
      ['恐龍蛋孵化扭蛋 第二彈', '龍杰嚴選', '中國', '2026-10-15', '4 個規格', 1, '#dcfce7'],
      ['電動泡泡槍 附補充液', 'BubbleFun', '中國', '2026-09-05', '2 個規格', 1, '#cffafe'],
      ['軟膠公仔 12cm 站姿', '史派克工廠', '日本', '2026-11', '3 個規格', 1, '#fce7f3'],
      ['城市系列拼裝積木 320pcs', 'BrickLab', '中國', '2026-08-20', '單規格', 0, '#f1f5f9'],
      ['迷你廚房家家酒組', 'SparkToy', '台灣', '2026-12', '2 個規格', 1, '#fef3c7'],
    ];
    return {
      accent,
      accentSoft: soft[accent] ?? '#eef2ff',
      accentText: text[accent] ?? '#4338ca',
      rows: data.map(([name, brand, origin, date, spec, active, tint], i) => ({
        name, brand, origin, date, spec, tint,
        status: active ? '使用中' : '已封存',
        badgeBg: active ? '#ecfdf5' : '#f1f5f9',
        badgeFg: active ? '#047857' : '#64748b',
        badgeDot: active ? '#10b981' : '#cbd5e1',
        nameColor: active ? '#0f172a' : '#94a3b8',
        rowBg: i === 1 ? '#f8fafc' : '#ffffff',
        iconColor: i === 1 ? '#475569' : '#cbd5e1',
        iconBorder: i === 1 ? '#e2e8f0' : 'transparent',
        iconBg: i === 1 ? '#ffffff' : 'transparent',
      })),
    };
  }
}
</script>
</body>
</html>
